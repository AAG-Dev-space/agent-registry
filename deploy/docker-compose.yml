services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: a2a-registry-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=a2a_registry
      - POSTGRES_USER=a2a_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-a2a_password_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2a_user -d a2a_registry"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: a2a-registry-backend:latest
    container_name: a2a-registry-backend
    restart: unless-stopped
    ports:
      - "7601:8000"
    environment:
      - STORAGE_TYPE=postgres
      - DATABASE_URL=postgresql+asyncpg://a2a_user:${POSTGRES_PASSWORD:-a2a_password_change_me}@postgres:5432/a2a_registry
      - STORAGE_DATA_DIR=/app/data
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    volumes:
      - backend-data:/app/data
      - ../config:/app/config:ro
    networks:
      - a2a-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: a2a-registry-frontend:latest
    container_name: a2a-registry-frontend
    restart: unless-stopped
    ports:
      - "7600:80"
    depends_on:
      - backend
    networks:
      - a2a-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  a2a-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  backend-data:
    driver: local
